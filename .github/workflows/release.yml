name: Publish deployment artifact

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM template
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep --outfile main.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.json --generate-notes --verify-tag
